# Bootstrap/HTTP tests only. Real PostgreSQL tests do not activate this profile.
spring:
  autoconfigure:
    exclude: org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

catalog:
  integration:
    base-url: https://catalog.example.test
    connect-timeout: 5s
    read-timeout: 30s
    # Configuration-only fixture; full application tests override this with an ephemeral key.
    private-key-location: file:/not-present/appointment-test-private.pem
    issuer: appointment-reservation-service
    audience: catalog-sync-service
    token-ttl: 5m

catedra:
  group-id: test-project
  technical-jwt: not-a-real-catedra-token
  rest:
    base-url: https://catedra.example.test
    connect-timeout: 5s
    read-timeout: 30s
  kafka:
    bootstrap-servers: kafka.example.test:9092
    consumer-group-id: test-project-consumer
    appointment-actions-topic: test.appointment.actions
    appointment-phone-topic: test.appointment.phone
