server:
  port: ${SERVER_PORT:8082}

catedra:
  group-id: ${CATEDRA_GROUP_ID:}
  technical-jwt: ${CATEDRA_TECHNICAL_JWT:}
  rest:
    base-url: ${CATEDRA_REST_BASE_URL:}
  kafka:
    bootstrap-servers: ${CATEDRA_KAFKA_BOOTSTRAP_SERVERS:}
    consumer-group-id: ${CATEDRA_KAFKA_CONSUMER_GROUP_ID:}
    appointment-actions-topic: ${CATEDRA_KAFKA_APPOINTMENT_ACTIONS_TOPIC:}
    appointment-phone-topic: ${CATEDRA_KAFKA_APPOINTMENT_PHONE_TOPIC:}

appointment:
  cors:
    allowed-origins: ${APPOINTMENT_CORS_ALLOWED_ORIGINS:}
  security:
    final-user-jwt:
      base64-secret: ${APPOINTMENT_USER_JWT_SECRET:}
      ttl: ${APPOINTMENT_USER_JWT_TTL:1h}
      remember-me-ttl: ${APPOINTMENT_USER_JWT_REMEMBER_ME_TTL:7d}

spring:
  datasource:
    url: ${APPOINTMENT_DB_URL}
    username: ${APPOINTMENT_DB_USERNAME}
    password: ${APPOINTMENT_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    validate-on-migrate: true
    locations: classpath:db/migration
